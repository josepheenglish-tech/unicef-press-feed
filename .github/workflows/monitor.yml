name: Daily UNICEF press feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: read
concurrency:
  group: press-monitor
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Collect and build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python monitor.py --workers 6 --pages 2 --site-url "$SITE_URL/"
      - name: Retain history
        run: |
          git config user.name 'press-monitor'
          git config user.email 'actions@users.noreply.github.com'
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m 'Update collected press history'
            git push
          fi
      - name: Include page icons
        run: |
          mkdir -p public/assets
          if [ -f lucide.min.js ]; then cp lucide.min.js public/assets/; fi
          if [ -f LUCIDE-LICENSE ]; then cp LUCIDE-LICENSE public/assets/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
